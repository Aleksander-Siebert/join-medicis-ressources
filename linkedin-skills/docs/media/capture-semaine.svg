<text x="20" y="98" xml:space="preserve" style="white-space:pre">  <tspan fill="#E58A7B">✖</tspan> « chiffre-d-abord » le 2026-10-06 et le 2026-10-08 : pas deux fois la même formule en 7 jours.</text>
<text x="20" y="118" xml:space="preserve" style="white-space:pre">  <tspan fill="#E58A7B">✖</tspan> Pilier « Rétention » : 100% des 3 posts sur 4 semaines. Aucun pilier au-delà de 60%.</text>
<text x="20" y="138" xml:space="preserve" style="white-space:pre"><tspan fill="#D4B681">  !</tspan> 2026-10-09 : angle « l'IA » : un angle, pas un sujet (ce qui s'est passé, le chiffre, la scène).</text>
<text x="20" y="158" xml:space="preserve" style="white-space:pre"><tspan fill="#D4B681">  !</tspan> Objectifs de la semaine : commentaires, sauvegardes. Avec 3 posts, vise au moins 3 objectifs</text>
<text x="20" y="178" xml:space="preserve" style="white-space:pre">    différents (commentaires, partages, réactions, sauvegardes).</text>
<text x="20" y="198" xml:space="preserve" style="white-space:pre"><tspan fill="#D4B681">  !</tspan> 2026-10-08 et 2026-10-09 : même objectif deux jours de suite.</text>
<text x="20" y="218" xml:space="preserve" style="white-space:pre"><tspan fill="#D4B681">  !</tspan> Liste d'engagement de 8 personnes : 10 se suivent sans tableur (6 pairs, 2 de portée, 2</text>
<text x="20" y="238" xml:space="preserve" style="white-space:pre">    acheteurs).</text>
<text x="20" y="258" xml:space="preserve" style="white-space:pre"><tspan fill="#D4B681">  !</tspan> Aucun acheteur dans la liste : ajoute 1 ou 2 personnes qui pourraient acheter, à commenter des</text>
<text x="20" y="278" xml:space="preserve" style="white-space:pre">    semaines avant tout message.</text>
