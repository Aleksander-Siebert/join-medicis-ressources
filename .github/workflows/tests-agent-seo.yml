# Vérifie les scripts de l'agent SEO sur Linux, macOS et Windows.
name: Tests de l'agent SEO

on:
  push:
    paths: ["plugins/agent-seo/**", "plugins/seo-skills/skills/**", ".github/workflows/tests-agent-seo.yml"]
  pull_request:
    paths: ["plugins/agent-seo/**", "plugins/seo-skills/skills/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/agent-seo
