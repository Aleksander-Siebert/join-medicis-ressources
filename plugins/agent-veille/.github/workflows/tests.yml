# Vérifie les scripts de l'agent sur Linux, macOS et Windows à chaque modification.
name: Tests

on:
  push:
    paths: ["scripts/**", "tests/**", "modeles/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # Python 3.9 n'est plus proposé sur les machines Ubuntu de GitHub.
          # Il reste testé sur macOS (c'est la version livrée par Apple) et sur Windows.
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
