<!doctype html>
<!--
  Modèle « par thème » : 3 points à retenir, puis les infos classées par rubrique, avec le « pour toi ».

  Couleurs, titre, logo et signature se règlent dans mail.json, sans toucher à ce fichier.
  Pour aller plus loin, copie ce fichier en modeles/perso.html, modifie la copie et écris "modele": "perso" dans mail.json.

  Comment ça marche :
  - {{nom}} est remplacé par une valeur (déjà protégée, le HTML des sources ne peut rien casser).
  - Un bloc qui va de « DEBUT:nom » à « FIN:nom » (dans deux commentaires HTML) est répété pour chaque élément d'une liste,
    ou affiché une seule fois s'il y a une valeur, ou retiré s'il n'y en a pas.

  Valeurs disponibles :
  - partout : {{objet}}, {{periode}}, {{pied}}, {{titre_veille}}, {{signature}}, {{couleur}}, {{accent}}, {{fond}}, {{carte}}
  - bloc logo : {{logo}}
  - bloc rien_de_neuf : {{rien_de_neuf}}
  - bloc a_retenir, puis bloc point : {{point}}
  - bloc section : {{section}}, puis bloc info : {{titre}}, {{date}}, {{texte}}
      - bloc pourquoi : {{pourquoi}}
      - bloc source : {{nom}}, {{url}}
  - bloc liste (toutes les infos à la suite, numérotées) : {{n}}, {{titre}}, {{url}}, {{media}}, {{date}}, {{texte}}
  - bloc a_surveiller, puis bloc surveiller : {{point}}

  Les mails n'acceptent que des styles écrits dans chaque balise (style="…") et des tableaux pour la mise en page :
  garde cette structure, change les valeurs.
  Vérifie le résultat : lance scripts/mail.py, puis ouvre sortie/mail.html dans ton navigateur.
-->
<html lang="fr">
<head><meta charset="utf-8"><title>{{objet}}</title></head>
<body style="margin:0;background:{{fond}};font-family:Georgia,serif;color:#2A211B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%;background:{{carte}};border:1px solid #e3d6b8;border-radius:10px;">

  <!-- DEBUT:logo -->
  <tr><td style="padding:22px 26px 0;"><img src="{{logo}}" alt="" height="36" style="height:36px;border:0;"></td></tr>
  <!-- FIN:logo -->
  <tr><td style="padding:22px 26px 6px;font-family:Arial,sans-serif;font-size:12px;color:{{accent}};letter-spacing:.08em;text-transform:uppercase;">{{titre_veille}} · {{periode}}</td></tr>
  <tr><td style="padding:0 26px 14px;font-size:24px;font-weight:bold;">{{objet}}</td></tr>

  <!-- DEBUT:rien_de_neuf -->
  <tr><td style="padding:0 26px 18px;font-family:Arial,sans-serif;font-size:15px;line-height:1.55;">{{rien_de_neuf}}</td></tr>
  <!-- FIN:rien_de_neuf -->

  <!-- DEBUT:a_retenir -->
  <tr><td style="padding:4px 26px 18px;"><div style="background:#ffffff;border-left:4px solid {{accent}};padding:12px 16px;">
    <div style="font-family:Arial,sans-serif;font-size:12px;font-weight:bold;color:{{couleur}};text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">À retenir</div>
    <ol style="margin:0;padding-left:20px;font-family:Arial,sans-serif;font-size:15px;line-height:1.5;">
      <!-- DEBUT:point --><li style="margin:4px 0;">{{point}}</li><!-- FIN:point -->
    </ol>
  </div></td></tr>
  <!-- FIN:a_retenir -->

  <!-- DEBUT:section -->
  <tr><td style="padding:10px 26px 4px;font-size:18px;font-weight:bold;color:{{couleur}};border-top:1px solid #e3d6b8;">{{section}}</td></tr>
  <!-- DEBUT:info -->
  <tr><td style="padding:8px 26px 10px;font-family:Arial,sans-serif;">
    <div style="font-size:15px;font-weight:bold;">{{titre}} <span style="color:#6B655D;font-weight:normal;">{{date}}</span></div>
    <div style="font-size:14px;line-height:1.55;margin-top:3px;">{{texte}}</div>
    <!-- DEBUT:pourquoi --><div style="font-size:14px;line-height:1.5;margin-top:4px;color:{{couleur}};"><b>Pour toi :</b> {{pourquoi}}</div><!-- FIN:pourquoi -->
    <div style="font-size:12px;margin-top:4px;color:#6B655D;">Sources : <!-- DEBUT:source --><a href="{{url}}" style="color:{{couleur}};">{{nom}}</a> &nbsp;<!-- FIN:source --></div>
  </td></tr>
  <!-- FIN:info -->
  <!-- FIN:section -->

  <!-- DEBUT:a_surveiller -->
  <tr><td style="padding:12px 26px 4px;font-size:16px;font-weight:bold;color:{{couleur}};border-top:1px solid #e3d6b8;">À surveiller</td></tr>
  <tr><td style="padding:0 26px 10px;"><ul style="margin:0;padding-left:20px;font-family:Arial,sans-serif;font-size:14px;line-height:1.5;">
    <!-- DEBUT:surveiller --><li>{{point}}</li><!-- FIN:surveiller -->
  </ul></td></tr>
  <!-- FIN:a_surveiller -->

  <tr><td style="padding:14px 26px 20px;font-family:Arial,sans-serif;font-size:12px;color:#6B655D;border-top:1px solid #e3d6b8;">{{pied}}<br>{{signature}}</td></tr>

</table>
</td></tr></table>
</body>
</html>
